server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressao dos arquivos de texto: o bundle passa de ~300KB para ~95KB.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # API
  #
  # O front chama caminhos relativos (/api/posts) e o Nginx repassa para o
  # container da API. Mesmo papel que o proxy do Vite cumpre em
  # desenvolvimento, entao o codigo do front e identico nos dois ambientes e
  # nao dependemos de CORS.
  #
  # A barra final em proxy_pass e essencial: ela remove o prefixo /api antes
  # de encaminhar. Sem ela, /api/posts chegaria na API como /api/posts e
  # responderia 404.
  # ---------------------------------------------------------------------------
  location /api/ {
    # -------------------------------------------------------------------------
    # A resolucao do nome precisa ser ADIADA para o momento da requisicao.
    #
    # Com um nome literal (proxy_pass http://api:3000/), o Nginx resolve o
    # upstream na INICIALIZACAO e se recusa a subir se ele nao existir:
    #
    #   [emerg] host not found in upstream "api"
    #
    # O container inteiro morreria sempre que a API estivesse fora -- e a
    # interface e publica, deveria continuar servindo o blog mesmo assim.
    #
    # Usar uma variavel no proxy_pass faz o Nginx resolver o nome a cada
    # requisicao. Se a API estiver fora, apenas as chamadas /api falham (502),
    # e o restante do site continua no ar.
    #
    # 127.0.0.11 e o DNS interno do Docker. Fora de uma rede Docker ele nao
    # existe, e o resultado e o mesmo: 502 nas chamadas de API, site servindo.
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_upstream "api:3000";

    # Remove o prefixo /api antes de encaminhar. Com proxy_pass por variavel
    # nao ha a remocao automatica que a barra final faria, entao ela e
    # explicita aqui.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;

    # Falhar rapido e melhor que pendurar a aba do usuario: sem estes limites,
    # uma API fora do ar deixaria a requisicao aberta ate o timeout padrao de
    # 60s, e a tela ficaria "carregando" sem explicacao.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---------------------------------------------------------------------------
  # Arquivos com hash no nome podem ser cacheados para sempre: qualquer
  # alteracao gera um nome novo.
  # ---------------------------------------------------------------------------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ---------------------------------------------------------------------------
  # Fallback de SPA -- indispensavel.
  #
  # Com roteamento no cliente, /posts/abc-123 so existe dentro do JavaScript.
  # Ao recarregar a pagina nesse endereco, o navegador pede o arquivo
  # "posts/abc-123" ao servidor, que nao existe: sem esta linha, todo F5 fora
  # da home e todo link compartilhado respondem 404, mesmo com a aplicacao
  # perfeita.
  # ---------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
