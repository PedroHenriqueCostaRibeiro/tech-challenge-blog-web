server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compressao dos arquivos de texto: o bundle passa de ~300KB para ~95KB.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # API
  #
  # O front chama caminhos relativos (/api/posts) e o Nginx repassa para o
  # container da API. Mesmo papel que o proxy do Vite cumpre em
  # desenvolvimento, entao o codigo do front e identico nos dois ambientes e
  # nao dependemos de CORS.
  #
  # A barra final em proxy_pass e essencial: ela remove o prefixo /api antes
  # de encaminhar. Sem ela, /api/posts chegaria na API como /api/posts e
  # responderia 404.
  # ---------------------------------------------------------------------------
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---------------------------------------------------------------------------
  # Arquivos com hash no nome podem ser cacheados para sempre: qualquer
  # alteracao gera um nome novo.
  # ---------------------------------------------------------------------------
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ---------------------------------------------------------------------------
  # Fallback de SPA -- indispensavel.
  #
  # Com roteamento no cliente, /posts/abc-123 so existe dentro do JavaScript.
  # Ao recarregar a pagina nesse endereco, o navegador pede o arquivo
  # "posts/abc-123" ao servidor, que nao existe: sem esta linha, todo F5 fora
  # da home e todo link compartilhado respondem 404, mesmo com a aplicacao
  # perfeita.
  # ---------------------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
